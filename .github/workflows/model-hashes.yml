name: Model hashes

# Downloads every model in the registry and prints its SHA-256, so the values
# can be pinned in videocraft/core/models_registry.py. Run it manually
# (Actions → Model hashes → Run workflow) after adding a model or when an
# upstream file changes. Nothing is published; the results are in the job log,
# the job summary and a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [claude/model-checksums]   # first run, before this file reaches main

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compute hashes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # optional; avoids Hugging Face rate limits
        run: python scripts/compute_model_hashes.py --out model-hashes.json
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Model hashes'
            echo '```json'
            cat model-hashes.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-hashes
          path: model-hashes.json
          if-no-files-found: warn
