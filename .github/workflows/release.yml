name: Release

# Push a tag like v0.2.0 to run the tests, build the packages and publish a
# GitHub release. Run it manually (Actions → Release → Run workflow) for a dry
# run that only builds and uploads the packages as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(python -c "import videocraft; print(videocraft.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package: $app_version  tag: $tag_version"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match videocraft.__version__ ($app_version)"
            exit 1
          fi

      - name: Build source and wheel packages
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCraft-packages
          path: dist/*
          if-no-files-found: error

  publish:
    # Only for tag pushes; manual runs stop after uploading the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoCraft-packages
          path: release-files
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install (Linux)

          \`\`\`bash
          git clone --branch $GITHUB_REF_NAME https://github.com/$GITHUB_REPOSITORY.git
          cd VideoCraft
          ./install.sh
          \`\`\`

          The installer sets up the app and, if you have an NVIDIA GPU, the matching PyTorch and AI
          packages. Needs Python 3.11 or 3.12 and FFmpeg. See the README for options and \`pipx\`.

          ---
          NOTES
          # 0.x releases are for testers → mark as pre-release.
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VideoCraft $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            $flags
