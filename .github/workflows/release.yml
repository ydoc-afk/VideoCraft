name: Release

# Push a tag like v0.2.0 to build the AppImage and publish a GitHub release.
# Run it manually (Actions → Release → Run workflow) for a dry run that only
# uploads the AppImage as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    # Oldest supported runner = oldest glibc, so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(sed -n 's/.*setApplicationVersion("\([^"]*\)").*/\1/p' main.py)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "app: $app_version  tag: $tag_version"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $app_version (main.py)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 xz-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # A static FFmpeg is bundled so testers don't need to install one. The
      # build is GPL-licensed, which is compatible with VideoCraft's GPL-3.0;
      # its source and license are linked from the download page below.
      - name: Fetch static FFmpeg
        run: |
          base=https://johnvansickle.com/ffmpeg/releases
          mkdir -p ffmpeg-dl && cd ffmpeg-dl
          curl -fSL --retry 3 -O "$base/ffmpeg-release-amd64-static.tar.xz"
          curl -fSL --retry 3 -O "$base/ffmpeg-release-amd64-static.tar.xz.md5"
          md5sum -c ffmpeg-release-amd64-static.tar.xz.md5
          tar -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1
          cd ..
          install -m 755 ffmpeg-dl/ffmpeg ffmpeg-dl/ffprobe assets/bin/
          ./assets/bin/ffmpeg -version | head -1

      - name: Build AppImage
        run: packaging/build_appimage.sh
        env:
          PYTHON: python

      - name: Smoke-test the bundle
        run: |
          # The AppImage needs FUSE to run directly; extract it instead.
          cd dist
          chmod +x VideoCraft-*.AppImage
          ./VideoCraft-*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/videocraft
          test -x squashfs-root/usr/bin/_internal/assets/bin/ffmpeg
          sha256sum VideoCraft-*.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCraft-AppImage
          path: |
            dist/VideoCraft-*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    # Only for tag pushes; manual runs stop after uploading the artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VideoCraft-AppImage
          path: release-files
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x releases are for testers → mark as pre-release.
          flags=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "VideoCraft $GITHUB_REF_NAME" \
            --generate-notes \
            $flags
